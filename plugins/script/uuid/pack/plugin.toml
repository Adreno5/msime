schema_version = 2
kind = "script"
id = "uuid"
name = "UUID"
version = "1.0.0"
license = "MIT"
description = "插件指令（provide_commands）和随机数（random_fill）的参考样板：在 / 指令里打 /uuid 或 /guid，给出同一个随机 UUID（版本 4）的四种写法。它用来演示插件怎样在自己的 / 指令里出候选，不是主打功能。"
permissions = ["provide_commands"]

[script]
abi = 1
module = "uuid.wasm"
hooks = ["command"]
memory_pages = 2

[[script.commands]]
trigger = "uuid"
title = "UUID"

[[script.commands]]
trigger = "guid"
title = "GUID"
