name = "LaTeX 符号"
version = "1.0.0"
license = "MIT"
description = "在 K 模式里按 LaTeX 的命令名打出符号：Kalpha 出 α，Kinfty 出 ∞，Krightarrow 出 →。命令名去掉反斜杠和花括号、全部小写（\\mathbb{R} 写成 mathbbr）；只差大小写的两个命令在同一个编码下，小写的在前（Kgamma 出 γ 和 Γ）。随桌面安装包分发，在插件页启用后才生效。"

